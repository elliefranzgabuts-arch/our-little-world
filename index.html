<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Our Little World ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">

    <!-- LOGIN CONTAINER -->

    <div class="login-container">

        <h1>
            Rylie's Little Space 
        </h1>

        <p>
          Hi Babyy!! 💜
        </p>


        <form id="loginForm">

            <!-- USERNAME -->

            <input
                type="text"
                id="username"
                placeholder="Call Sign"
                autocomplete="username"
                required
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="password"
                placeholder="Date that you answered me"
                autocomplete="current-password"
                required
            >


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login  
            </button>


            <!-- MESSAGE -->

            <p id="message"></p>

        </form>

    </div>


    <script src="script.js"></script>

</body>

</html>
