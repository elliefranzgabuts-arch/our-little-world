    <style>

        /* ==================================================
           MEMORY CAROUSEL
        ================================================== */

        .memory-carousel-section {

            text-align: center;

            padding:
                70px
                20px
                50px;

            overflow: hidden;

        }


        .memory-carousel-section h1 {

            font-family: var(--font-display);
            font-style: italic;
            font-weight: 600;

            color: var(--plum-deep);

            font-size: 2.7rem;

            margin-bottom: 10px;

        }


        .carousel-subtitle {

            color: var(--ink-soft);

            margin-bottom: 40px;

        }


        /* ==================================================
           CAROUSEL AREA
        ================================================== */

        .memory-carousel {

            width: 100%;

            max-width: 1100px;

            height: 450px;

            margin: auto;

            position: relative;

            perspective: 1400px;

            overflow: visible;

        }


        .carousel-track {

            width: 100%;

            height: 100%;

            position: relative;

            transform-style: preserve-3d;

        }


        /* ==================================================
           PHOTO CARD
        ================================================== */

        .memory-slide {

            position: absolute;

            width: 280px;

            height: 360px;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 22px;

            overflow: hidden;

            background:
                #ffffff;

            border: 6px solid #fff;
            outline: 1px solid var(--line);

            box-shadow:
                0 20px 50px
                rgba(
                    58,
                    34,
                    71,
                    0.28
                );

            cursor: pointer;

            transition:
                transform
                0.8s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                ),

                opacity
                0.8s
                ease,

                filter
                0.8s
                ease;

        }


        .memory-slide img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            user-select: none;

            -webkit-user-drag: none;

        }


        /* ==================================================
           PHOTO NUMBER
        ================================================== */

        .memory-number {

            position: absolute;

            top: 15px;

            left: 15px;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                radial-gradient(circle at 32% 28%, var(--gold-soft), var(--gold) 70%);

            box-shadow:
                0 6px 16px rgba(179, 135, 63, 0.4),
                inset 0 0 0 2px rgba(255, 255, 255, 0.25);

            color:
                var(--paper);

            font-family: var(--font-display);
            font-weight: 600;

            font-size:
                12px;

            z-index: 5;

        }


        /* ==================================================
           CONTROLS
        ================================================== */

        .carousel-controls {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            margin-top: 20px;

        }


        .carousel-controls button {

            width: 52px;

            height: 52px;

            border: 1px solid var(--line);

            border-radius: 50%;

            cursor: pointer;

            color: var(--plum);

            font-size: 18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.85
                );

            box-shadow:
                0 8px 25px
                rgba(
                    58,
                    34,
                    71,
                    0.12
                );

            transition:
                transform
                0.2s
                ease,

                background
                0.2s
                ease;

        }

        .carousel-controls button:hover {

            background: var(--plum);
            color: var(--paper);

        }


        .carousel-controls button:hover {

            transform:
                scale(1.1);

        }


        .carousel-controls button:active {

            transform:
                scale(0.95);

        }


        #playMemory {

            width: 60px;

            height: 60px;

            font-size: 22px;

        }


        /* ==================================================
           DOTS
        ================================================== */

        .carousel-dots {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 9px;

            margin-top: 22px;

        }


        .carousel-dot {

            width: 9px;

            height: 9px;

            padding: 0;

            border: none;

            border-radius: 50%;

            cursor: pointer;

            background: var(--rose);

            opacity: 0.35;

            transition:
                transform
                0.3s
                ease,

                opacity
                0.3s
                ease;

        }


        .carousel-dot.active {

            opacity: 1;

            background: var(--gold);

            transform:
                scale(1.6);

        }


        /* ==================================================
           IMAGE VIEWER
        ================================================== */

        .image-modal {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                rgba(
                    44,
                    32,
                    53,
                    0.9
                );

            backdrop-filter: blur(4px);

            z-index: 9999;

        }


        .image-modal img {

            max-width: 95vw;

            max-height: 90vh;

            object-fit: contain;

            border-radius: 15px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

            border: 6px solid #fff;

        }


        .image-modal-close {

            position: absolute;

            top: 20px;

            right: 25px;

            width: 45px;

            height: 45px;

            border: none;

            border-radius: 50%;

            cursor: pointer;

            font-size: 30px;

            color: white;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            transition:
                background
                0.25s
                ease,

                transform
                0.25s
                ease;

        }

        .image-modal-close:hover {

            background: var(--gold);

            transform: rotate(90deg);

        }


        /* ==================================================
           FOOTER
        ================================================== */

        .memories-footer {

            text-align: center;

            padding:
                30px
                20px;

            opacity: 0.75;

        }


        /* ==================================================
           MOBILE / IPHONE
        ================================================== */

        @media (
            max-width: 700px
        ) {

            .memory-carousel-section {

                padding:
                    50px
                    10px
                    30px;

            }


            .memory-carousel-section h1 {

                font-size:
                    2rem;

            }


            .memory-carousel {

                height:
                    360px;

            }

                width:
                    220px;

                    290px;

            .carousel-controls {

                    15px;

            .carousel-controls button {

                width:
                    46px;

                    46px;

                    55px;

                    55px;

        /* ==================================================

                height:
                    320px;

            }

                width:
                    190px;

                height:
                    255px;

            }

        }

    </style>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* ==================================================
                   LOGIN CHECK
                ================================================== */

                const username =
                    localStorage.getItem(
                        "username"
                    );


                if (!username) {

                    window.location.href =
                        "index.html";

                    return;

                }



                /* ==================================================
                   ELEMENTS
                ================================================== */

                const slides =
                    document.querySelectorAll(
                        ".memory-slide"
                    );


                const previousBtn =
                    document.getElementById(
                        "previousMemory"
                    );


                const nextBtn =
                    document.getElementById(
                        "nextMemory"
                    );


                const playBtn =
                    document.getElementById(
                        "playMemory"
                    );


                const dotsContainer =
                    document.getElementById(
                        "carouselDots"
                    );


                const logoutBtn =
                    document.getElementById(
                        "logoutBtn"
                    );


                const imageModal =
                    document.getElementById(
                        "imageModal"
                    );


                const modalImage =
                    document.getElementById(
                        "modalImage"
                    );


                const imageModalClose =
                    document.getElementById(
                        "imageModalClose"
                    );



                /* ==================================================
                   VARIABLES
                ================================================== */

                let currentIndex = 0;

                let autoRotate = true;

                let autoRotateTimer = null;



                /* ==================================================
                   CHECK PHOTOS
                ================================================== */

                if (
                    slides.length === 0
                ) {

                    return;

                }



                /* ==================================================
                   CREATE DOTS
                ================================================== */

                slides.forEach(
                    function (
                        slide,
                        index
                    ) {

                        const dot =
                            document.createElement(
                                "button"
                            );


                        dot.type =
                            "button";


                        dot.className =
                            "carousel-dot";


                        dot.setAttribute(
                            "aria-label",
                            "Go to memory " +
                            (
                                index + 1
                            )
                        );


                        dot.addEventListener(
                            "click",
                            function () {

                                currentIndex =
                                    index;


                                updateCarousel();


                                restartAutoRotate();

                            }
                        );


                        dotsContainer.appendChild(
                            dot
                        );

                    }
                );


                const dots =
                    document.querySelectorAll(
                        ".carousel-dot"
                    );



                /* ==================================================
                   UPDATE CAROUSEL
                ================================================== */

                function updateCarousel() {

                    const total =
                        slides.length;


                    slides.forEach(
                        function (
                            slide,
                            index
                        ) {


                            let offset =
                                index -
                                currentIndex;


                            /*
                             * Circular positioning
                             */

                            if (
                                offset >
                                total / 2
                            ) {

                                offset -=
                                    total;

                            }


                            if (
                                offset <
                                -total / 2
                            ) {

                                offset +=
                                    total;

                            }



                            /* ==================================================
                               POSITION
                            ================================================== */

                            const translateX =
                                offset *
                                245;


                            const rotateY =
                                offset *
                                -45;


                            const scale =
                                offset === 0
                                    ? 1
                                    : 0.78;


                            const opacity =
                                Math.abs(
                                    offset
                                ) > 2
                                    ? 0
                                    : 1;


                            const zIndex =
                                100 -
                                Math.abs(
                                    offset
                                );



                            slide.style.transform =
                                `
                                translate(
                                    calc(
                                        -50% +
                                        ${translateX}px
                                    ),
                                    -50%
                                )
                                rotateY(
                                    ${rotateY}deg
                                )
                                scale(
                                    ${scale}
                                )
                                `;


                            slide.style.opacity =
                                opacity;


                            slide.style.zIndex =
                                zIndex;



                            /* ==================================================
                               DARKEN SIDE PHOTOS
                            ================================================== */

                            if (
                                offset === 0
                            ) {

                                slide.style.filter =
                                    "none";

                            }

                            else {

                                slide.style.filter =
                                    "brightness(0.65)";

                            }

                        }
                    );



                    /* ==================================================
                       UPDATE DOTS
                    ================================================== */

                    dots.forEach(
                        function (
                            dot,
                            index
                        ) {

                            dot.classList.toggle(
                                "active",
                                index ===
                                currentIndex
                            );

                        }
                    );

                }



                /* ==================================================
                   NEXT
                ================================================== */

                function nextSlide() {

                    currentIndex++;


                    if (
                        currentIndex >=
                        slides.length
                    ) {

                        currentIndex = 0;

                    }


                    updateCarousel();

                }



                /* ==================================================
                   PREVIOUS
                ================================================== */

                function previousSlide() {

                    currentIndex--;


                    if (
                        currentIndex < 0
                    ) {

                        currentIndex =
                            slides.length - 1;

                    }


                    updateCarousel();

                }



                /* ==================================================
                   NEXT BUTTON
                ================================================== */

                nextBtn.addEventListener(
                    "click",
                    function () {

                        nextSlide();

                        restartAutoRotate();

                    }
                );



                /* ==================================================
                   PREVIOUS BUTTON
                ================================================== */

                previousBtn.addEventListener(
                    "click",
                    function () {

                        previousSlide();

                        restartAutoRotate();

                    }
                );



                /* ==================================================
                   PLAY / PAUSE
                ================================================== */

                playBtn.addEventListener(
                    "click",
                    function () {

                        autoRotate =
                            !autoRotate;


                        if (
                            autoRotate
                        ) {

                            playBtn.textContent =
                                "⏸";


                            playBtn.setAttribute(
                                "aria-label",
                                "Pause carousel"
                            );


                            startAutoRotate();

                        }

                        else {

                            playBtn.textContent =
                                "▶";


                            playBtn.setAttribute(
                                "aria-label",
                                "Play carousel"
                            );


                            stopAutoRotate();

                        }

                    }
                );



                /* ==================================================
                   START AUTO ROTATE
                ================================================== */

                function startAutoRotate() {

                    stopAutoRotate();


                    autoRotateTimer =
                        setInterval(
                            function () {

                                nextSlide();

                            },
                            3000
                        );

                }



                /* ==================================================
                   STOP AUTO ROTATE
                ================================================== */

                function stopAutoRotate() {

                    if (
                        autoRotateTimer
                    ) {

                        clearInterval(
                            autoRotateTimer
                        );


                        autoRotateTimer =
                            null;

                    }

                }



                /* ==================================================
                   RESTART AUTO ROTATE
                ================================================== */

                function restartAutoRotate() {

                    if (
                        autoRotate
                    ) {

                        startAutoRotate();

                    }

                }



                /* ==================================================
                   CLICK CENTER IMAGE
                ================================================== */

                slides.forEach(
                    function (
                        slide,
                        index
                    ) {

                        slide.addEventListener(
                            "click",
                            function () {

                                if (
                                    index !==
                                    currentIndex
                                ) {

                                    currentIndex =
                                        index;


                                    updateCarousel();


                                    restartAutoRotate();

                                    return;

                                }


                                const image =
                                    slide.querySelector(
                                        "img"
                                    );


                                if (!image) {

                                    return;

                                }


                                modalImage.src =
                                    image.src;


                                modalImage.alt =
                                    image.alt;


                                imageModal.style.display =
                                    "flex";


                                imageModal.setAttribute(
                                    "aria-hidden",
                                    "false"
                                );


                                stopAutoRotate();

                            }
                        );

                    }
                );



                /* ==================================================
                   CLOSE IMAGE
                ================================================== */

                function closeImageModal() {

                    imageModal.style.display =
                        "none";


                    imageModal.setAttribute(
                        "aria-hidden",
                        "true"
                    );


                    modalImage.src = "";


                    if (
                        autoRotate
                    ) {

                        startAutoRotate();

                    }

                }



                imageModalClose.addEventListener(
                    "click",
                    closeImageModal
                );



                /* ==================================================
                   CLICK OUTSIDE IMAGE
                ================================================== */

                imageModal.addEventListener(
                    "click",
                    function (
                        event
                    ) {

                        if (
                            event.target ===
                            imageModal
                        ) {

                            closeImageModal();

                        }

                    }
                );



                /* ==================================================
                   ESC KEY
                ================================================== */

                document.addEventListener(
                    "keydown",
                    function (
                        event
                    ) {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            if (
                                imageModal.style.display ===
                                "flex"
                            ) {

                                closeImageModal();

                            }

                        }

                    }
                );



                /* ==================================================
                   LOGOUT
                ================================================== */

                if (logoutBtn) {

                    logoutBtn.addEventListener(
                        "click",
                        function () {


                            /*
                             * Stop carousel
                             */

                            stopAutoRotate();


                            /*
                             * Remove login
                             */

                            localStorage.removeItem(
                                "username"
                            );


                            /*
                             * Remove secret session
                             */

                            sessionStorage.removeItem(
                                "secretsUnlocked"
                            );


                            /*
                             * Return to login
                             */

                            window.location.href =
                                "index.html";

                        }
                    );

                }



                /* ==================================================
                   INITIALIZE
                ================================================== */

                updateCarousel();


                startAutoRotate();

            }

        );

    </script>
