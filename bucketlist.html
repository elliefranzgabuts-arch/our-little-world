    <!-- ==================================================

    <script>

        "use strict";


        /* ==================================================
           LOGIN CHECK
        ================================================== */

        const username =
            localStorage.getItem("username");

        if (!username) {

            window.location.href =
                "index.html";

        }


        /* ==================================================
           LOGOUT
        ================================================== */

        const logoutBtn =
            document.getElementById("logoutBtn");

        if (logoutBtn) {

            logoutBtn.addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "username"
                    );

                    localStorage.removeItem(
                        "bucketProgress"
                    );

                    window.location.href =
                        "index.html";

                }
            );

        }


        /* ==================================================
           GET ELEMENTS
        ================================================== */

        const checkboxes =
            document.querySelectorAll(
                ".bucket-item input[type='checkbox']"
            );

        const progressText =
            document.getElementById(
                "progressText"
            );

        const progressFill =
            document.getElementById(
                "progressFill"
            );

        const progressBar =
            document.getElementById(
                "progressBar"
            );


        /* ==================================================
           LOAD SAVED PROGRESS
        ================================================== */

        function loadProgress() {

            let saved = [];

            try {

                const stored =
                    localStorage.getItem(
                        "bucketProgress"
                    );

                if (stored) {

                    const parsed =
                        JSON.parse(stored);

                    if (Array.isArray(parsed)) {

                        saved = parsed;

                    }

                }

            } catch (error) {

                console.warn(
                    "Could not load bucket progress:",
                    error
                );

                saved = [];

            }


            checkboxes.forEach(
                function (checkbox) {

                    checkbox.checked =
                        saved.includes(
                            checkbox.dataset.id
                        );

                }
            );

        }


        /* ==================================================
           UPDATE PROGRESS
        ================================================== */

        function updateProgress() {

            const total =
                checkboxes.length;

            const completed =
                document.querySelectorAll(
                    ".bucket-item input[type='checkbox']:checked"
                ).length;


            const percentage =
                total > 0
                    ? Math.round(
                        (completed / total) * 100
                    )
                    : 0;


            /* Update progress bar */

            if (progressFill) {

                progressFill.style.width =
                    percentage + "%";

            }


            /* Update progress text */

            if (progressText) {

                if (
                    completed === total &&
                    total > 0
                ) {

                    progressText.textContent =
                        "All completed! ❤️";

                } else {

                    progressText.textContent =
                        `${completed} of ${total} completed`;

                }

            }


            /* Update accessibility */

            if (progressBar) {

                progressBar.setAttribute(
                    "aria-valuenow",
                    percentage
                );

            }


            /* Save checked items */

            const checked = [];

            checkboxes.forEach(
                function (checkbox) {

                    if (checkbox.checked) {

                        checked.push(
                            checkbox.dataset.id
                        );

                    }

                }
            );


            try {

                localStorage.setItem(
                    "bucketProgress",
                    JSON.stringify(checked)
                );

            } catch (error) {

                console.warn(
                    "Could not save bucket progress:",
                    error
                );

            }

        }


        /* ==================================================
           CHECKBOX EVENTS
        ================================================== */

        checkboxes.forEach(
            function (checkbox) {

                checkbox.addEventListener(
                    "change",
                    updateProgress
                );

            }
        );


        /* ==================================================
           INITIALIZE
        ================================================== */

        loadProgress();

        updateProgress();

    </script>
